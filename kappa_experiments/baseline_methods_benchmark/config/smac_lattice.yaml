map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugins: ["SmacLattice"]

    SmacLattice:
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      tolerance: 0.10
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      analytic_expansion_ratio: 3.5
      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.05
      cost_penalty: 2.0
      rotation_penalty: 5.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 1.0
      transform_tolerance: 0.5
      resolution: 0.01
      track_unknown_space: false
      rolling_window: false
      footprint_padding: 0.0
      footprint: >-
        [[0.170000, 0.000000], [0.157060, 0.065055],
         [0.120208, 0.120208], [0.065055, 0.157060],
         [0.000000, 0.170000], [-0.065055, 0.157060],
         [-0.120208, 0.120208], [-0.157060, 0.065055],
         [-0.170000, 0.000000], [-0.157060, -0.065055],
         [-0.120208, -0.120208], [-0.065055, -0.157060],
         [0.000000, -0.170000], [0.065055, -0.157060],
         [0.120208, -0.120208], [0.157060, -0.065055]]
      plugins: ["static_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      always_send_full_costmap: true

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["map_server", "planner_server"]

